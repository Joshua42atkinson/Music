name: Voix Vive Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'apps/companion-app/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: apps/companion-app

    - name: Run Linter
      run: npm run lint
      working-directory: apps/companion-app
      
    - name: Run Tests
      run: npm run test --if-present
      working-directory: apps/companion-app

    - name: Run Build
      run: npm run build
      working-directory: apps/companion-app
