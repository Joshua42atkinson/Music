  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a2332;
      font-family: 'Inter', sans-serif;
      color: #c8c8d0;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0a0a0f;
      z-index: 9999;
    }

    .initial-loader {
      width: 48px;
      height: 48px;
      border: 2px solid #354560;
      border-top: 2px solid #c9a96e;
      border-radius: 50%;
      animation: spin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.125rem;
      font-style: italic;
      color: #8090a8;
      letter-spacing: 0.05em;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
