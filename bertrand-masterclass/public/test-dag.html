<!DOCTYPE html>
<html>
<head>
  <title>DAG Test</title>
  <style>body{font-family:monospace;padding:20px;background:#0a0a0f;color:#c9a96e;}</style>
</head>
<body>
  <h1>Voix Vive DAG Diagnostic</h1>
  <div id="out">Loading...</div>
  <script type="module">
    try {
      const mod = await import('/src/data/dag/dagNodes.js');
      const nodes = mod.dagNodes;
      const meta = mod.FRET_METADATA;
      document.getElementById('out').innerHTML = `
        <p style="color:#34d399">SUCCESS: dagNodes loaded</p>
        <p>Total nodes: ${nodes.length}</p>
        <p>Fret 1 nodes: ${nodes.filter(n=>n.fret===1).length}</p>
        <p>Fret 2 nodes: ${nodes.filter(n=>n.fret===2).length}</p>
        <p>Fret 12 nodes: ${nodes.filter(n=>n.fret===12).length}</p>
        <p>Sample prompt: ${nodes[0]?.troubadourPrompt?.substring(0,60)}...</p>
      `;
    } catch(e) {
      document.getElementById('out').innerHTML = `<p style="color:#ff4e50">ERROR: ${e.message}</p><pre>${e.stack}</pre>`;
    }
  </script>
</body>
</html>
