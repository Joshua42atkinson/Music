<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voix Vive — Bertrand Laurence Masterclass</title>
  <meta name="description" content="Voix Vive — a living, breathing guitar Masterclass by Bertrand Laurence. Unlock your living voice through somatic intelligence, the Hero's Journey, and the flow state." />
  <meta name="keywords" content="guitar lessons, music theory, CAGED system, Bertrand Laurence, flow state, mindful practice, kinesthetic learning" />
  <meta name="author" content="Joshua Atkinson" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a2332;
      font-family: 'Inter', sans-serif;
      color: #c8c8d0;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0a0a0f;
      z-index: 9999;
    }

    .initial-loader {
      width: 48px;
      height: 48px;
      border: 2px solid #354560;
      border-top: 2px solid #c9a96e;
      border-radius: 50%;
      animation: spin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.125rem;
      font-style: italic;
      color: #8090a8;
      letter-spacing: 0.05em;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="loader-container">
      <div class="initial-loader"></div>
      <p class="loading-text">Preparing the space…</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
