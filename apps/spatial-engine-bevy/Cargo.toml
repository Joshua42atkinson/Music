[package]
name = "voix-vive-xr"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Joshua Atkinson"]
description = "Voix Vive XR — Spatial Guitar Academy (Bevy OpenXR)"

[lib]
crate-type = ["lib", "cdylib"]
name = "voix_vive_xr"

[[bin]]
name = "voix-vive-desktop"
path = "src/bin/desktop.rs"

[[bin]]
name = "voix-vive-xr"
path = "src/bin/xr.rs"
required-features = ["xr"]

[features]
default = []
extras = [
    "dep:tokio",
    "dep:warp",
    "dep:futures-util",
]
desktop = [
    "bevy/bevy_winit",
    "bevy/bevy_pbr",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_window",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_scene",
    "bevy/bevy_log",
    "bevy/bevy_state",
    "bevy/bevy_sprite",
    "bevy/bevy_gltf",
    "bevy/bevy_audio",
    "bevy/multi_threaded",
    "bevy/default_font",
    "bevy/tonemapping_luts",
    "bevy/x11",
    "bevy/wayland",
    "bevy/picking",
    "bevy_panorbit_camera",
]
xr = [
    "bevy/bevy_render",
    "bevy/bevy_pbr",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_asset",
    "bevy/bevy_scene",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_mesh",
    "bevy/bevy_log",
    "bevy/bevy_state",
    "bevy/bevy_gltf",
    "bevy/bevy_audio",
    "bevy/multi_threaded",
    "bevy/default_font",
    "bevy/tonemapping_luts",
    "bevy/picking",
    "dep:bevy_mod_xr",
    "dep:bevy_mod_openxr",
]

[dependencies]
# Bevy ECS + rendering (minimal — features enabled via feature flags)
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_state", "bevy_pbr", "bevy_sprite", "bevy_render", "bevy_core_pipeline",
    "bevy_asset", "bevy_scene", "bevy_text", "bevy_window", "bevy_mesh",
    "bevy_ui", "bevy_log", "png", "webgl2", "zstd_rust",
] }
bevy_reflect = "0.18.1"

# XR / OpenXR integration (optional — enabled by `xr` feature)
bevy_mod_xr = { version = "0.5", optional = true }
bevy_mod_openxr = { version = "0.5", optional = true, features = ["vulkan"] }
openxr = { version = "0.21", optional = true }

# Desktop camera controls (optional — enabled by `desktop` feature)
bevy_panorbit_camera = { version = "0.34", optional = true }

# Audio input for pitch detection
cpal = "0.15"
crossbeam-channel = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IPC dependencies (optional — enabled by "extras" feature)
tokio = { version = "1", features = ["full"], optional = true }
warp = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
jni = { version = "0.21", default-features = false }

[package.metadata.android]
package = "com.voixvive.xr"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 30
target_sdk_version = 36
max_sdk_version = 36
resources = "res"
assets = "assets"
android_manifest_path = "AndroidManifest.xml"
permissions = [
    "android.permission.INTERNET",
    "android.permission.RECORD_AUDIO",
    "android.permission.CAMERA",
]

[package.metadata.android.signing.release]
path = "/home/joshua/.android/debug.keystore"
keystore_password = "android"
